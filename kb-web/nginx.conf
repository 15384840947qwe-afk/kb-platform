# KB前端站点：静态托管dist + /kb反代到网关。
# SSE流式接口必须关代理缓冲，否则AI回答不是一段段蹦出来而是憋到最后一次性吐
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # API反代：与vite开发代理同规则，/kb原样透传给网关
    location /kb/ {
        proxy_pass http://kb-gateway:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # SSE三件套：关缓冲、关缓存、声明事件流
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
    }

    # 上传附件走MinIO签名直链，文件体积大，放宽body限制
    client_max_body_size 60m;

    # Vue Router history模式：兜底回index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
