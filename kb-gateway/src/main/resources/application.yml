server:
  # 9001：short-url的网关占了9000，不能撞
  port: 9001

spring:
  application:
    name: kb-gateway
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        # 和kb-service同理：单机部署钉死回环地址，避免自动选到虚拟网卡IP
        ip: 127.0.0.1
    gateway:
      routes:
        # 唯一一条路由：/kb/** 转给知识库服务。
        # 这里没有short-url那种/**兜底规则，所以不存在顺序问题
        - id: kb-route
          uri: lb://kb-service
          predicates:
            - Path=/kb/**